<!-- src/app/menu/menu.html -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/list-shoes">👟 Shoe Store</a>
    
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <!-- Tout le monde voit Liste et Rechercher -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/list-shoes" routerLinkActive="active">📋 Liste</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/search-shoes" routerLinkActive="active">🔍 Rechercher</a>
        </li>
        
        <!-- Seuls les ADMINS voient Ajouter et Dashboard -->
        <li class="nav-item" *ngIf="au.testerAdmin()">
          <a class="nav-link" routerLink="/add-shoes" routerLinkActive="active">➕ Ajouter</a>
        </li>
        <li class="nav-item" *ngIf="au.testerAdmin()">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">📊 Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/chat" routerLinkActive="active">🤖 Chat IA</a>
        </li>
      </ul>
      
      <span class="navbar-text text-white me-3" *ngIf="au.isConnected">
        👤 {{ au.userCourant }} ({{ au.roleCourant }})
      </span>
      
      <button class="btn btn-outline-light" (click)="disconnect()" *ngIf="au.isConnected">
        🚪 Déconnexion
      </button>
    </div>
  </div>
</nav>
