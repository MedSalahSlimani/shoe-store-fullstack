<div class="container">
  <h2>Modifier une chaussure</h2>

  <form>
    <div>
      <label>Marque :</label>
      <select [(ngModel)]="prodCourant.marque" name="marque">
        <option *ngFor="let m of tab_marq" [value]="m">{{ m }}</option>
      </select>
    </div>

    <div>
      <label>Modèle :</label>
      <input type="text" [(ngModel)]="prodCourant.modele" name="modele">
    </div>

    <div>
      <label>Description :</label>
      <textarea [(ngModel)]="prodCourant.description" name="description"></textarea>
    </div>

    <div>
      <label>Taille :</label>
      <input type="number" [(ngModel)]="prodCourant.taille" name="taille">
    </div>

    <div>
      <label>Couleur :</label>
      <input type="text" [(ngModel)]="prodCourant.couleur" name="couleur">
    </div>

    <div>
      <label>Code barres :</label>
      <input type="text" [(ngModel)]="prodCourant.codeBarres" name="codeBarres">
    </div>

    <div>
      <label>Poids (g) :</label>
      <input type="number" [(ngModel)]="prodCourant.poids" name="poids">
    </div>

    <div>
      <label>Date sortie :</label>
      <input type="date" [(ngModel)]="prodCourant.dateSortie" name="dateSortie">
    </div>

    <div>
      <label>Prix (€) :</label>
      <input type="number" step="0.01" [(ngModel)]="prodCourant.prix" name="prix">
    </div>

    <div>
      <label>Promo (€) :</label>
      <input type="number" step="0.01" [(ngModel)]="prodCourant.promo" name="promo">
    </div>

    <div>
      <label>Disponible :</label>
      <input type="checkbox" [(ngModel)]="prodCourant.disponible" name="disponible">
    </div>

    <button type="button" (click)="updateProduct()">💾 Enregistrer</button>
    <button type="button" (click)="goBack()">❌ Annuler</button>
  </form>
</div>
