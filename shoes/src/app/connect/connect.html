<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <h1 style="text-align: center">Connexion</h1>
      <br />
      <div class="container mt-5">
        <div class="row justify-content-md-center">
          <div class="col-md-6">
            <form>
              <div class="form-group">
                <label>Login</label>
                <input
                  type="email"
                  name="login"
                  class="form-control"
                  [(ngModel)]="unUser.email"
                  (change)="reset()"
                  required
                />
              </div>
              <div class="form-group">
                <label>Mot de passe</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  [(ngModel)]="unUser.mot2pass"
                  (change)="reset()"
                  required
                />
              </div>
              @if (erreur) {
              <div class="text-err">
                <p>Login et/ou mot de passe incorrect</p>
              </div>
              }
              <div class="text-center">
                <button type="button" class="btn btn-success" (click)="logon()">Connexion</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
